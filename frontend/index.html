<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>假期统计日历</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header><h1>📅 假期统计日历</h1></header>
  <main>
    <form id="holiday-form">
      <input id="name" type="text" placeholder="姓名" maxlength="50" required>
      <label>开始 <input id="start" type="date" required></label>
      <label>结束 <input id="end" type="date" required></label>
      <button type="submit">添加假期</button>
    </form>
    <div id="message" role="status"></div>
    <div class="nav">
      <button id="prev">◀</button>
      <h2 id="month-title"></h2>
      <button id="next">▶</button>
      <button id="today">今天</button>
    </div>
    <div id="calendar"></div>
    <h3>本月假期</h3>
    <ul id="list"></ul>
    <div id="legend"></div>
  </main>
  <script src="script.js"></script>
</body>
</html>
